    <script>
      // Aplică tema salvată înainte de prima randare, ca să nu apară
      // o sclipire de temă greșită. Implicit: verde-albastru închis.
      ;(function () {
        try {
          var stored = localStorage.getItem('dan-enache-theme')
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (error) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
