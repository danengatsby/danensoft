# Politica de securitate a conținutului, doar pentru site-ul static din dist/.
#
# Paginile servite de serviciul Node (/admin, /cont) își trimit propria politică,
# din server/index.mjs — au nevoie de alte permisiuni. Nu includeți fișierul
# acesta în blocurile care fac proxy, altfel browserul aplică ambele politici
# simultan (intersecția lor) și administrarea se strică.
#
# Hash-ul acoperă singurul script inline din index.html, cel care aplică tema
# salvată înainte de prima randare. Dacă scriptul acela se modifică, hash-ul se
# recalculează cu:
#
#     npm run csp:hash
#
# Fără actualizare, scriptul e blocat: site-ul funcționează, dar reapare
# sclipirea de temă greșită la încărcare.
#
# `style-src 'unsafe-inline'` este necesar: React scrie atribute `style` pe
# elemente, iar acestea intră sub style-src.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-zKjsSYboKRcALVZeDcPhrF9oZbB96gMz4QDEElIukFQ='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
