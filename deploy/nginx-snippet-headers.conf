# Antete de securitate comune, pentru site-ul static și pentru paginile
# randate de serviciul Node.
#
# Atenție la moștenire: în nginx, un bloc `location` care are propriul
# `add_header` NU mai moștenește antetele definite mai sus. De aceea fișierul
# acesta trebuie inclus explicit în fiecare `location` care adaugă antete
# proprii (de exemplu cele cu `Cache-Control`).
#
# `always` face antetele să apară și pe răspunsurile de eroare (404, 413, 500).

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
